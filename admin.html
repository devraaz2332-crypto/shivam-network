<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shivam Network Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/"><span class="mark">SN</span><span><b>SHIVAM NETWORK</b><small>ADMIN PANEL</small></span></a><a href="/">View Store</a></header><main class="section"><div id="loginBox" class="dialog"><h2>Admin Login</h2><form id="login"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="primary">Sign In</button></form><p id="loginMsg" class="notice"></p></div><div id="dashboard" hidden><div class="section-head"><h2>Store Dashboard</h2><button class="cartbtn" id="logout">Log out</button></div><h3>Add Product</h3><form id="productForm" class="dialog"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category"><input name="price" type="number" min="0" placeholder="Price (₹)" required><input name="stock" type="number" min="0" placeholder="Stock"><input name="image" placeholder="Product image HTTPS URL"><textarea name="description" placeholder="Description"></textarea><button class="primary">Save Product</button></form><p id="productMsg" class="notice"></p><h3>Products</h3><div id="adminProducts"></div><h3>Customer Orders</h3><div id="orders"></div></div></main><script src="/admin.js"></script></body></html>
